# TrustMeBro contracts: Foundry config for Whitechain Sepolia (chain 1874).
# solc / evm_version follow https://docs.whitechain.io/build/deploy/deploy-with-foundry.md
# Do not change compiler settings after deploying: Blockscout verification needs the exact same ones.

[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["node_modules"]
solc = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
  { access = "read", path = "./test/fixtures" },
  { access = "read-write", path = "./deployments" },
]

[fuzz]
runs = 1000

[rpc_endpoints]
whitechain_sepolia = "https://rpc.testnet.whitechain.io"

[fmt]
line_length = 120
